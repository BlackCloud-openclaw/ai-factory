version: "3.9"

services:

  llamacpp-coder:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-coder
    profiles: ["manual"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /home/data/llama-models:/models:ro
      - /home/data/docker/llama-models.ini:/presets/config.ini:ro
    environment:
      - GGML_HIPBLAS=on # 启用 AMD GPU 加速
      - LLAMA_SET_ROWS=1
      - ROCBLAS_USE_HIPBLASLT=1
      - HSA_ENABLE_SDMA=0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: >-
      -m /models/Qwen2.5-Coder-32B-Instruct-Q5_K_M.gguf
      --models-preset /presets/config.ini
      --host 0.0.0.0
      --port 8080
      --flash-attn on
      -ngl -1
      --threads 16
      --threads-batch 32
      --no-mmap
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ai_factory_net

  llamacpp-writing:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-writing
    profiles: ["manual"]
    restart: unless-stopped
    ports:
      - "8082:8080"  # 将容器的8080端口映射到宿主机的8081端口
    volumes:
      - /home/data/llama-models:/models:ro
    environment:
      - GGML_HIPBLAS=on # 启用 AMD GPU 加速
      - LLAMA_SET_ROWS=1
      - ROCBLAS_USE_HIPBLASLT=1
      - HSA_ENABLE_SDMA=0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: >-
      -m /models/Qwen3-32B-Q5_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --flash-attn on
      -ngl -1
      --threads 16
      --threads-batch 32
      --no-mmap
      --parallel 1
      --n-predict 1024
      --batch-size 128
      --ubatch-size 64
      --ctx-size 32768
      --temp 0.72
      --top-p 0.9
      --top-k 50
      --repeat_penalty 1.06
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ai_factory_net
      
  llamacpp-research:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-research
    profiles: ["manual"]
    restart: unless-stopped
    ports:
      - "8083:8080"  # 将容器的8080端口映射到宿主机的8081端口
    volumes:
      - /home/data/llama-models:/models:ro
      - /home/data/docker/llama-models.ini:/presets/config.ini:ro
    environment:
      - GGML_HIPBLAS=on # 启用 AMD GPU 加速
      - LLAMA_SET_ROWS=1
      - ROCBLAS_USE_HIPBLASLT=1
      - HSA_ENABLE_SDMA=0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: >-
      -m /models/DeepSeek-R1-Distill-Llama-70B-Q5_K_M.gguf
      --models-preset /presets/config.ini
      --host 0.0.0.0
      --port 8080
      --flash-attn on
      -ngl -1
      --threads 16
      --threads-batch 32
      --no-mmap
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ai_factory_net 
      
  llamacpp-validate:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-validate
    profiles: ["manual"]
    restart: unless-stopped
    ports:
      - "8084:8080"  # 将容器的8080端口映射到宿主机的8081端口
    volumes:
      - /home/data/llama-models:/models:ro
      - /home/data/docker/llama-models.ini:/presets/config.ini:ro
    environment:
      - GGML_HIPBLAS=on # 启用 AMD GPU 加速
      - LLAMA_SET_ROWS=1
      - ROCBLAS_USE_HIPBLASLT=1
      - HSA_ENABLE_SDMA=0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: >-
      -m /models/DeepSeek-R1-Distill-Qwen-32B-Q5_K_M.gguf
      --models-preset /presets/config.ini
      --host 0.0.0.0
      --port 8080
      --flash-attn on
      -ngl -1
      --threads 16
      --threads-batch 32
      --no-mmap
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ai_factory_net      

  llamacpp-plan:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-plan
    profiles: ["manual"]
    restart: unless-stopped
    ports:
      - "8085:8080"  # 将容器的8080端口映射到宿主机的8081端口
    volumes:
      - /home/data/llama-models:/models:ro
      - /home/data/docker/llama-models.ini:/presets/config.ini:ro
    environment:
      - GGML_HIPBLAS=on # 启用 AMD GPU 加速
      - LLAMA_SET_ROWS=1
      - ROCBLAS_USE_HIPBLASLT=1
      - HSA_ENABLE_SDMA=0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: >-
      -m /models/Qwen3-32B-Q5_K_M.gguf
      --models-preset /presets/config.ini
      --host 0.0.0.0
      --port 8080
      --flash-attn on
      -ngl -1
      --threads 16
      --threads-batch 32
      --no-mmap
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ai_factory_net 
      
  llamacpp-default:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-default
    profiles: ["manual"]
    restart: unless-stopped
    ports:
      - "8086:8080"  # 将容器的8080端口映射到宿主机的8081端口
    volumes:
      - /home/data/llama-models:/models:ro
      - /home/data/docker/llama-models.ini:/presets/config.ini:ro
    environment:
      - GGML_HIPBLAS=on # 启用 AMD GPU 加速
      - LLAMA_SET_ROWS=1
      - ROCBLAS_USE_HIPBLASLT=1
      - HSA_ENABLE_SDMA=0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: >-
      -m /models/Qwen3.6-27B-Q5_K_M.gguf
      --models-preset /presets/config.ini
      --host 0.0.0.0
      --port 8080
      --flash-attn on
      -ngl -1
      --threads 16
      --threads-batch 32
      --no-mmap
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ai_factory_net

  llamacpp-embedding:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llamacpp-embedding
    restart: unless-stopped
    ports:
      - "8087:8080"
    volumes:
      - /home/data/llama-models:/models:ro
    environment:
      - GGML_HIPBLAS=on
      - LLAMA_SET_ROWS=1
      - ROCBLAS_USE_HIPBLASLT=1
      - HSA_ENABLE_SDMA=0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command:
      - "-m"
      - "/models/bge-small-zh-v1.5-q4_k_m.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--embedding"
      - "-c"
      - "512"
      - "--threads"
      - "16"
      - "--no-mmap"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ai_factory_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: woami
      POSTGRES_PASSWORD: kali
      POSTGRES_DB: ai_factory
    volumes:
      - /home/data/postgres:/var/lib/postgresql/data
    networks:
      - ai_factory_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw -d openclaw"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ai_factory_net:
    driver: bridge

 