  「有意思，」少年猛地掐住玉简血色纹路，三重灵根光芒暴涨，「宗门典籍记载的验灵阵结构，根本与这符文对不上。」


  长老袍袖翻涌：「这是动摇宗门根基的大罪！三日后若不交出玉简——」


