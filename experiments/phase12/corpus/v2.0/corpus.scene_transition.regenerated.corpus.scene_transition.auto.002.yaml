scene_before: '林逸按着玄铁令牌纹路踏进幻境时，青铜古镜正将血色月光折射成蛛网状裂痕。残魂的声音像浸在冰水里：「小家伙，认出三百年前的禁地文书阁了吗？，」「哼，」他盯着悬浮半空的玉简，指尖灵力游走，「这分明是血狼内丹的纹路。，」「有意思，」残魂冷笑，「那你说说看——是镜中炼丹炉先炸裂，还是你身后墙壁的巫族符文先剥落？，」林逸猛然转身，背后青石墙上的符文正在融化，而镜中画面却分明显示着完整无缺的丹房。他右眼突然刺痛，九劫体质的血脉共鸣让视网膜浮现出半张残破玉简的虚影。


  「选择时间到了，」残魂指尖凝聚出幽蓝火焰，「相信血色战场的真实，还是相信眼前幻境？」林逸咬破舌尖，血腥味混着灵泉池的气息在口腔炸开。，他突然读懂玉佩与玄铁令牌的共鸣规律，抬手接住坠落的半张玉简：「！，」幽蓝火焰擦过耳际时，幻境穹顶裂开三道金纹，残魂最后的话混着血雾消散：「巫族印记觉醒后...」「获得残缺记忆。」林逸攥紧玉简跌出幻境，右眼残留的血色映着青铜古镜，镜面浮现出上古修士覆灭前的最后招式。'
