scene_before: "{\n    \"scene_text\": \"林逸指尖轻抚过《心魔录》泛黄的书页，忽见某页墨迹在玉佩辉映下浮现双影。他眯眼辨认：'三日前子时，藏书阁烛火暗三次，对应心魔躁动时刻分毫不差'。\\\
