global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 加载告警规则文件
rule_files:
  - "alerts.yml"

# 可选：配置告警管理器（如果使用 Alertmanager）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'ai_factory'
    static_configs:
      - targets: ['172.17.0.1:8000']