characters:
  - character: 林逸
    speech_style: 少年沉稳，偶尔冲动，短句为主，说话直接
    common_phrases: ["哼", "有意思", "我偏不信", "好"]
    sentence_length: short
    vocabulary_tags: ["直白", "坚定"]
    forbidden_words: ["呵呵", "哈哈"]
    preferred_patterns:
      - "哼.+"
      - "有意思"
    emotional_baseline:
      喜: 0.6
      怒: 0.3
      哀: 0.1
      乐: 0.5

  - character: 反派
    speech_style: 阴险狡诈，阴阳怪气，多用反问
    common_phrases: ["呵呵", "你猜", "不知死活", "有趣"]
    sentence_length: short
    vocabulary_tags: ["阴冷", "嘲讽"]
    forbidden_words: ["朋友", "感谢", "有意思"]
    forced_tone: "嘲讽"
    emotional_baseline:
      喜: 0.1
      怒: 0.5
      哀: 0.1
      乐: 0.4

  - character: 二叔
    speech_style: 慈祥长辈，语气温和，多用关怀口吻
    common_phrases: ["孩子", "小心", "不错", "好好修炼"]
    sentence_length: medium
    vocabulary_tags: ["慈祥", "关切"]
    forbidden_words: ["有意思", "哼"]
    emotional_baseline:
      喜: 0.7
      怒: 0.1
      哀: 0.2
      乐: 0.6
