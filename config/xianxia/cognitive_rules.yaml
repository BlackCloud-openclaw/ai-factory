# config/xianxia/cognitive_rules.yaml
# 认知身份一致性规则 - 题材无关的规则引擎

# ============ 1. 信念违反规则 ============
# 当角色持有某信念时，若正文中出现对应关键词，则判定为违背
belief_violations:
  不杀无辜: ["杀", "斩杀", "屠杀", "灭口", "处决"]
  不背叛朋友: ["出卖", "背叛", "告密", "陷害"]
  强者为尊: ["屈服", "求饶", "认输"]
  丹药不可靠: ["服用丹药", "吞服丹药", "嗑药"]
  不食言: ["毁约", "失信", "食言"]

# ============ 2. 自我认知规则 ============
# 当 self_image 包含 match 中的关键词时，正文中不得出现 forbidden_keywords
self_image_rules:
  # 天弃之子 → 不该得机缘
  - match: ["天弃", "弃子", "被遗弃者"]
    forbidden_keywords: ["机缘", "奇遇", "天赐", "传承", "神兵", "遗产", "天命"]
    description: "天弃者不应获得天赐机缘"

  # 复仇者 → 不该宽容
  - match: ["复仇", "报仇", "血仇", "誓报"]
    forbidden_keywords: ["原谅", "宽恕", "放下仇恨", "释怀", "和解", "忘记仇恨"]
    description: "复仇者不应表现宽容"

  # 守护者 → 不该弃守
  - match: ["守护", "护卫", "守夜人"]
    forbidden_keywords: ["放弃", "退缩", "逃跑", "背弃", "渎职"]
    description: "守护者不应放弃职责"

# ============ 3. 依恋规则 ============
# 当角色对某对象有依恋时，正文中不得对其实施负面行为
attachment_rules:
  # 默认负面词（所有依恋对象通用）
  default_negative_keywords:
    - "丢弃"
    - "毁掉"
    - "遗弃"
    - "破坏"
    - "砸"
    - "毁损"
  
  # 特定类型的依恋额外词（可选）
  family_negative_keywords:
    - "背弃"
    - "出卖"
    - "抛弃"
  
  artifact_negative_keywords:
    - "丢弃"
    - "毁坏"
    - "砸碎"
    - "熔炼"

# ============ 4. 道德底线规则 ============
# 每个道德底线对应的违规关键词
boundary_violations:
  不杀无辜: ["杀", "斩杀", "屠杀", "灭口"]
  不背叛宗门: ["背叛", "出卖", "投敌", "叛变"]
  不偷盗: ["偷", "盗", "窃取", "顺手"]
  不欺骗: ["欺骗", "撒谎", "骗", "欺诈"]
  不食言: ["毁约", "失信", "食言"]